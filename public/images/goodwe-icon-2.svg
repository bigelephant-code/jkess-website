<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Car body - sedan shape, centered in 100x100 -->
  <path d="M12,70 L12,63 L22,53 L37,45 L77,45 L85,53 L93,58 L95,63 L95,70 L89,73 L79,73 L74,70 L25,70 L20,73 L15,73 Z" stroke="black" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <!-- Windshield -->
  <path d="M39,47 L33,57 L45,57 L45,47 Z" stroke="black" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Rear window -->
  <path d="M49,47 L49,57 L73,57 L69,49 L63,45 Z" stroke="black" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Door line -->
  <line x1="47" y1="49" x2="47" y2="67" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Front wheel -->
  <circle cx="29" cy="70" r="8" stroke="black" stroke-width="3" fill="none"/>
  <circle cx="29" cy="70" r="3" stroke="black" stroke-width="2" fill="none"/>
  <!-- Rear wheel -->
  <circle cx="69" cy="70" r="8" stroke="black" stroke-width="3" fill="none"/>
  <circle cx="69" cy="70" r="3" stroke="black" stroke-width="2" fill="none"/>
</svg>
