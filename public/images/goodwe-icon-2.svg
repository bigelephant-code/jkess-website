<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Car body - sedan shape, vertically centered -->
  <path d="M12,55 L12,48 L22,38 L37,30 L77,30 L85,38 L93,43 L95,48 L95,55 L89,58 L79,58 L74,55 L25,55 L20,58 L15,58 Z" stroke="black" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <!-- Windshield -->
  <path d="M39,32 L33,42 L45,42 L45,32 Z" stroke="black" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Rear window -->
  <path d="M49,32 L49,42 L73,42 L69,34 L63,30 Z" stroke="black" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Door line -->
  <line x1="47" y1="34" x2="47" y2="52" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Front wheel -->
  <circle cx="29" cy="55" r="8" stroke="black" stroke-width="3" fill="none"/>
  <circle cx="29" cy="55" r="3" stroke="black" stroke-width="2" fill="none"/>
  <!-- Rear wheel -->
  <circle cx="69" cy="55" r="8" stroke="black" stroke-width="3" fill="none"/>
  <circle cx="69" cy="55" r="3" stroke="black" stroke-width="2" fill="none"/>
</svg>
